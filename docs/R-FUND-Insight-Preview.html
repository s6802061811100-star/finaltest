function options(list,current,empty){return (empty?`<option value="">${esc(empty)}</option>`:'')+list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(current)?'selected':''}>${esc(l)}</option>`).join('');}
function facultyOptions(current,empty,activeOnly=false){return options(state.data.faculties.filter(f=>!activeOnly||bool(f.active)).map(f=>[f.faculty_id,f.faculty_name]),current,empty);}
function filters({allYears=false,search=false}={}){return `<div class="filters soft"><label>ปีการศึกษา<select data-filter="year" aria-label="ปีการศึกษา">${options(years().map(y=>[y,y]),state.year,allYears?'ทุกปี':null)}</select></label><label>คณะ<select data-filter="faculty" aria-label="คณะ">${facultyOptions(state.faculty,'ทุกคณะ')}</select></label>${search?`<label class="search-field">ค้นหาข้อมูล<input data-filter="search" aria-label="ค้นหาข้อมูล" value="${esc(state.search)}" placeholder="ชื่อคณะ / ปี / หมายเหตุ"></label>`:''}<button class="outline" data-action="reset">ล้างตัวกรอง</button></div>`;}
function selected(){return filtered(state.data.funding,{year:state.year,faculty:state.faculty,search:state.search});}
function badge(value){return `<span class="delta ${value==null?'neutral':value>=0?'positive':'negative'}">${value==null?'เทียบไม่ได้':(value>=0?'↗ ':'↘ ')+percent(value)}</span>`;}
function kpi(label,value,unit,delta,iconName='chart'){return `<article class="kpi soft"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon(iconName)}</span></div><div class="kpi-value">${value}<small>${unit}</small></div>${delta!==undefined?badge(delta):'<span class="kpi-sub">ข้อมูลตามตัวกรองปัจจุบัน</span>'}</article>`;}
function overview(){
 const rows=selected(),s=summary(rows),previous=years().filter(y=>y<Number(state.year)).at(-1),prior=summary(filtered(state.data.funding,{year:previous,faculty:state.faculty}));
 // Only compare when a previous year exists; do not label whole-dataset values as a prior year.
 const delta=k=>previous?change(s[k],prior[k]):null;
 const timeline=years().map(y=>({year:y,value:summary(filtered(state.data.funding,{year:y,faculty:state.faculty})).total})).filter(p=>p.value!==null);
 return `${filters()}<div class="kpi-grid">${kpi('เงินทุนรวม',s.total==null?'—':num(s.total/1e6),'ล้านบาท',delta('total'))}${kpi('ทุนภายใน',s.internal==null?'—':num(s.internal/1e6),'ล้านบาท',delta('internal'),'folder')}${kpi('ทุนภายนอก',s.external==null?'—':num(s.external/1e6),'ล้านบาท',delta('external'),'chart')}${kpi('จำนวนอาจารย์',num(s.fte),'คน/FTE',delta('fte'),'user')}</div><div class="dashboard-grid"><article class="panel soft main-chart"><div class="panel-title"><div><span class="eyebrow">FACULTY RANKING</span><h2>เงินทุนแยกตามคณะ</h2></div><button class="text-button" data-page="funding">ดูทั้งหมด ${icon('arrow')}</button></div><p class="caption">6 คณะที่มียอดรวมสูงสุดในปี ${esc(state.year)} · ทุนภายในและภายนอกแสดงแยกกัน</p>${bars([...rows].sort((a,b)=>b.total_fund-a.total_fund).slice(0,6),['internal_fund','external_fund'],['ทุนภายใน','ทุนภายนอก'])}</article><article class="panel soft"><span class="eyebrow">FUNDING MIX</span><h2>สัดส่วนแหล่งทุน</h2>${donut(s.internal,s.external)}</article><article class="panel soft"><div class="panel-title"><div><span class="eyebrow">YEARLY TREND</span><h2>แนวโน้มเงินทุน</h2></div><span class="muted">ล้านบาท</span></div>${trend(timeline)}<p class="caption">แสดงทุกปีที่มีข้อมูลของคณะที่เลือก</p></article><article class="panel soft insight-panel"><span class="eyebrow">PERFORMANCE</span><h2>ประสิทธิภาพเงินทุน</h2><div class="metric-line"><span>เงินทุนต่ออาจารย์/FTE</span><strong>${money(s.average)} <small>บาท</small></strong></div><div class="metric-line"><span>คะแนนเฉลี่ยรายคณะ</span><strong>${s.score==null?'—':s.score.toFixed(4)} <small>/ 5</small></strong></div><div class="score-track"><span style="width:${(s.score||0)/5*100}%"></span></div><p class="caption">ค่าเฉลี่ยต่อ FTE = เงินทุนรวม ÷ FTE รวม<br>คะแนนเฉลี่ย = ค่าเฉลี่ยเลขคณิตรายคณะ ไม่ถ่วงน้ำหนัก</p></article></div><p class="source-caption">อ่านจาก ${state.demo?'ไฟล์ Excel ตัวอย่าง':'Google Sheet'} · ${s.count} รายการ${previous?' · เปรียบเทียบกับปี '+previous:''}</p>`;
}
function fundingTable(rows,editable=false){return `<div class="table-wrap"><table><thead><tr><th>ปี</th><th>คณะ</th><th class="numeric">อาจารย์/FTE</th><th class="numeric">ทุนภายใน</th><th class="numeric">ทุนภายนอก</th><th class="numeric">เงินทุนรวม</th><th class="numeric">บาท/FTE</th><th class="numeric">คะแนน</th>${editable?'<th>จัดการ</th>':''}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><span class="year-tag">${r.academic_year}</span></td><td><b>${esc(r.faculty_name)}</b>${r.note?`<small class="table-note">${esc(r.note)}</small>`:''}</td><td class="numeric">${num(r.teacher_count)}</td><td class="numeric">${money(r.internal_fund)}</td><td class="numeric">${money(r.external_fund)}</td><td class="numeric total">${money(r.total_fund)}</td><td class="numeric">${money(r.average_per_teacher)}</td><td class="numeric"><span class="score-badge">${Number(r.score).toFixed(4)}</span></td>${editable?`<td><div class="row-actions"><button data-action="edit-funding" data-id="${esc(r.record_id)}" class="small outline">แก้ไข</button>${isAdmin()?`<button data-action="delete-funding" data-id="${esc(r.record_id)}" class="small danger-text">ลบ</button>`:''}</div></td>`:''}</tr>`).join(''):`<tr><td colspan="${editable?9:8}" class="empty">ไม่มีข้อมูลที่ตรงกับตัวกรอง</td></tr>`}</tbody></table></div>`;}
function funding(){const rows=selected(),s=summary(rows);return `${filters({allYears:true,search:true})}<article class="panel soft"><div class="panel-title"><div><h2>รายการเงินทุน</h2><p class="caption">${rows.length} รายการ · 1 รายการต่อคณะต่อปีการศึกษา</p></div>${canWrite()?`<button class="primary" data-action="add-funding">${icon('plus')} เพิ่มข้อมูล</button>`:'<span class="pill">ดูข้อมูลเท่านั้น</span>'}</div>${fundingTable(rows,canWrite())}<div class="table-total">รวม ${money(s.total)} บาท <span>FTE รวม ${num(s.fte)}</span></div></article>`;}
function compare(){
 const rows=filtered(state.data.funding,{faculty:state.faculty}),a=state.compareA,b=state.compareB,table=comparisons(rows,a,b).sort((x,y)=>(y.delta??-Infinity)-(x.delta??-Infinity));

function audit(){if(!state.admin)return '<div class="panel soft">กำลังอ่านประวัติ…</div>';return `<article class="panel soft"><h2>รายการที่ลบแล้ว</h2><p class="caption">กู้คืนได้หากยังไม่มีข้อมูลคณะและปีเดียวกัน</p><div class="table-wrap"><table><thead><tr><th>ปี</th><th>คณะ</th><th>ผู้แก้ไขล่าสุด</th><th>กู้คืน</th></tr></thead><tbody>${state.admin.deleted.map(r=>`<tr><td>${r.academic_year}</td><td>${esc(r.faculty_name)}</td><td>${esc(r.updated_by)}</td><td><button class="outline small" data-action="restore" data-id="${esc(r.record_id)}">กู้คืน</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ไม่มีรายการที่ลบ</td></tr>'}</tbody></table></div></article><article class="panel soft"><h2>ประวัติ 500 รายการล่าสุด</h2><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>รายละเอียด</th></tr></thead><tbody>${state.admin.audit.map((r,i)=>`<tr><td>${esc(new Date(r.timestamp).toLocaleString('th-TH'))}</td><td>${esc(r.username)}</td><td>${esc(r.action)}</td><td class="id-cell">${esc(r.entity_id)}</td><td><button class="small outline" data-action="audit-detail" data-id="${i}">ดู</button></td></tr>`).join('')}</tbody></table></div></article>`;}

}
function navButton(p){return `<button data-page="${p}" class="nav-item ${state.page===p?'active':''}" ${state.page===p?'aria-current="page"':''}>${icon(glyphs[p])}<span>${titles[p]}</span></button>`;}
async function go(page){state.page=page;render();if(isAdmin()&&['users','audit'].includes(page)&&!state.admin){try{state.admin=await api('adminData');render();}catch(e){toast(e.message,true);}}}
function openDialog(title,body,formId,button='บันทึก'){
 modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">R-FUND INSIGHT</span><h2 id="modal-title">${title}</h2></div><button class="icon-button" data-action="close-modal" aria-label="ปิด">×</button></div>${formId?`<form id="${formId}">${body}<p class="form-error" id="modal-error" role="alert"></p><div class="modal-footer"><button type="button" class="outline" data-action="close-modal">ยกเลิก</button><button class="primary" type="submit">${button}</button></div></form>`:body}`;
 modal.showModal();
}
function fundingDialog(id){
 const r=state.data.funding.find(x=>x.record_id===id)||{academic_year:state.year||years().at(-1)||2568,faculty_id:'',teacher_count:'',internal_fund:0,external_fund:0,score:0,score_mode:'MANUAL',note:''};
 openDialog(id?'แก้ไขข้อมูลเงินทุน':'เพิ่มข้อมูลเงินทุน',`<input type="hidden" name="record_id" value="${esc(r.record_id||'')}"><input type="hidden" name="revision" value="${r.revision||''}"><div class="form-grid"><label class="field">ปีการศึกษา<input name="academic_year" type="number" min="2500" max="2700" step="1" value="${r.academic_year}" required></label><label class="field">คณะ<select name="faculty_id" required>${facultyOptions(r.faculty_id,'เลือกคณะ',true)}</select></label><label class="field span-two">จำนวนอาจารย์/FTE<input name="teacher_count" type="number" min="0.01" max="100000" step="any" value="${r.teacher_count}" required></label><label class="field">ทุนภายใน (บาท)<input name="internal_fund" type="number" min="0" max="10000000000000" step="0.01" value="${r.internal_fund}" required></label><label class="field">ทุนภายนอก (บาท)<input name="external_fund" type="number" min="0" max="10000000000000" step="0.01" value="${r.external_fund}" required></label><div class="calculated span-two"><span>เงินทุนรวม <b id="calculated-total">${money(r.total_fund||0)}</b></span><span>บาท/FTE <b id="calculated-average">${money(r.average_per_teacher||0)}</b></span></div><label class="field">วิธีให้คะแนน<select name="score_mode">${options([['MANUAL','คะแนนจากแหล่งข้อมูล'],['AUTO','คำนวณตามเกณฑ์']],r.score_mode)}</select></label><label class="field">คะแนน (0–5)<input name="score" type="number" min="0" max="5" step="any" value="${r.score}" required></label><label class="field span-two">หมายเหตุ<textarea name="note" maxlength="2000" rows="3">${esc(r.note)}</textarea></label></div><p class="caption" id="score-help">${r.score_mode==='AUTO'?'คำนวณจากเกณฑ์คณะและปีที่กำหนด':'คงคะแนนเดิมจากข้อมูลต้นทาง'}</p>`,'funding-form');calc();
}
function calc(){const f=document.querySelector('#funding-form');if(!f)return;const v=Object.fromEntries(new FormData(f)),total=Number(v.internal_fund||0)+Number(v.external_fund||0),avg=Number(v.teacher_count)>0?total/Number(v.teacher_count):null;document.querySelector('#calculated-total').textContent=money(total);document.querySelector('#calculated-average').textContent=money(avg);const auto=v.score_mode==='AUTO';f.elements.score.readOnly=auto;f.elements.score.required=!auto;const c=state.data.criteria.find(c=>Number(c.academic_year)===Number(v.academic_year)&&c.faculty_id===v.faculty_id);if(auto){f.elements.score.value=c&&avg!=null?Math.min(5,avg/Number(c.target_per_teacher)*5).toFixed(6):'';document.querySelector('#score-help').textContent=c?'เป้าหมายสำหรับ 5 คะแนน: '+money(c.target_per_teacher)+' บาท/FTE':'ยังไม่มีเกณฑ์ของคณะและปีนี้ กรุณาตั้งเกณฑ์ก่อน';}else document.querySelector('#score-help').textContent='ใช้คะแนนจากแหล่งข้อมูล (0–5)';}
function facultyDialog(id){const f=state.data.faculties.find(x=>x.faculty_id===id)||{};openDialog(id?'แก้ไขคณะ':'เพิ่มคณะ',`<input type="hidden" name="faculty_id" value="${esc(id||'')}"><label class="field">ชื่อคณะ<input name="faculty_name" required maxlength="200" value="${esc(f.faculty_name||'')}"></label><label class="field">สถานะ<select name="active">${options([['true','เปิดใช้งาน'],['false','ปิดใช้งาน']],f.active===undefined?'true':String(bool(f.active)))}</select></label>`,'faculty-form');}
function userDialog(id){const u=state.admin?.users.find(x=>x.username===id)||{role:'TEACHER',active:true};openDialog(id?'แก้ไขผู้ใช้ / รีเซ็ตรหัสผ่าน':'เพิ่มผู้ใช้',`<div class="form-grid"><label class="field">ชื่อผู้ใช้<input name="username" value="${esc(id||'')}" ${id?'readonly':''} required pattern="[a-z0-9._-]{3,60}"></label><label class="field">ชื่อแสดง<input name="display_name" value="${esc(u.display_name||'')}" required maxlength="200"></label><label class="field">บทบาท<select name="role">${options(['ADMIN','TEACHER','OWNER'].map(v=>[v,v]),u.role)}</select></label><label class="field">สถานะ<select name="active">${options([['true','เปิดใช้งาน'],['false','ปิดใช้งาน']],String(u.active))}</select></label><label class="field span-two">${id?'รหัสผ่านใหม่ (เว้นว่างเพื่อใช้เดิม)':'รหัสผ่าน'}<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" ${id?'':'required'}></label></div><p class="caption">รีเซ็ตรหัสผ่านหรือเปลี่ยนสิทธิ์แล้ว เซสชันเดิมของผู้ใช้จะหมดอายุ</p>`,'user-form');}
function confirmDialog(title,body,action,id){openDialog(title,`<p>${body}</p><div class="modal-footer"><button class="outline" data-action="close-modal">ยกเลิก</button><button class="primary ${action==='confirm-delete'?'danger':''}" data-action="${action}" data-id="${esc(id)}">${action==='confirm-delete'?'ยืนยันลบ':'ยืนยันกู้คืน'}</button></div>`);}
async function mutation(action,payload,button){
 if(state.busy)return;state.busy=true;if(button){button.disabled=true;button.dataset.original=button.textContent;button.textContent='กำลังบันทึก…';}
 try{await api(action,payload);modal.close();await load();await go(state.page);toast('บันทึกข้อมูลเรียบร้อยแล้ว');}
 catch(e){const error=document.querySelector('#modal-error');if(error&&modal.open)error.textContent=e.message;else toast(e.message,true);}
 finally{state.busy=false;if(button?.isConnected){button.disabled=false;button.textContent=button.dataset.original;}}
}
app.addEventListener('change',e=>{const key=e.target.dataset.filter;if(key){state[key]=e.target.value;render();}});
let searchTimer;app.addEventListener('input',e=>{if(e.target.dataset.filter==='search'){state.search=e.target.value;const pos=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const x=app.querySelector('[data-filter="search"]');x.focus();x.setSelectionRange(pos,pos);},180);}});
modal.addEventListener('input',calc);modal.addEventListener('change',calc);
document.addEventListener('click',async e=>{
 const btn=e.target.closest('button[data-action],button[data-page]');if(!btn)return;
 if(btn.dataset.page){await go(btn.dataset.page);return;}
 const action=btn.dataset.action,id=btn.dataset.id;
 try{
 switch(action){
 case 'eye':{const input=document.querySelector('input[name="password"]');input.type=input.type==='password'?'text':'password';btn.setAttribute('aria-label',input.type==='password'?'แสดงรหัสผ่าน':'ซ่อนรหัสผ่าน');break;}
 case 'close-modal':if(!state.busy)modal.close();break;
 case 'reset':state.faculty='';state.search='';state.year=String(years().at(-1)||2568);render();break;
 case 'refresh':if(!state.demo){btn.disabled=true;await load();await go(state.page);}else toast('ข้อมูลตัวอย่างจาก Excel');break;
 case 'logout':if(!state.demo)await api('logout');state.user=null;state.data=null;state.admin=null;state.demo=false;renderLogin();break;
 case 'password':if(state.demo){toast('ตัวอย่างเปิดให้ดูข้อมูลเท่านั้น');break;}openDialog('เปลี่ยนรหัสผ่าน',`<label class="field">รหัสผ่านปัจจุบัน<input name="current_password" type="password" required autocomplete="current-password"></label><label class="field">รหัสผ่านใหม่ (8–128 ตัวอักษร)<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><p class="caption">เปลี่ยนแล้วต้องเข้าสู่ระบบใหม่</p>`,'password-form','เปลี่ยนรหัสผ่าน');break;
case 'add-funding':if(canWrite())fundingDialog();break;
case 'edit-funding':if(canWrite())fundingDialog(id);break;
 case 'delete-funding':{if(!isAdmin())break;const r=state.data.funding.find(r=>r.record_id===id);confirmDialog('ลบข้อมูลเงินทุน',`ลบ ${esc(r.faculty_name)} ปี ${r.academic_year}? รายการจะถูกเก็บไว้ในหน้าประวัติเพื่อกู้คืน`,'confirm-delete',id);break;}
 case 'confirm-delete':{const r=state.data.funding.find(r=>r.record_id===id);await mutation('deleteFunding',{record_id:id,revision:r.revision},btn);break;}
 case 'restore':{const r=state.admin.deleted.find(r=>r.record_id===id);confirmDialog('กู้คืนข้อมูล',`กู้คืน ${esc(r.faculty_name)} ปี ${r.academic_year}?`,'confirm-restore',id);break;}
 case 'confirm-restore':{const r=state.admin.deleted.find(r=>r.record_id===id);await mutation('restoreFunding',{record_id:id,revision:r.revision},btn);break;}
 case 'add-faculty':if(isAdmin())facultyDialog();break;
 case 'edit-faculty':if(isAdmin())facultyDialog(id);break;
 case 'add-user':if(isAdmin())userDialog();break;
 case 'edit-user':if(isAdmin())userDialog(id);break;
 case 'export-csv':exportCsv(reportRows(),'R-FUND-'+(state.year||'all')+'.csv');toast('ส่งออก CSV แล้ว');break;
 case 'export-xlsx':download(xlsx(reportRows()),'R-FUND-'+(state.year||'all')+'.xlsx');toast('ส่งออก Excel แล้ว');break;
 case 'print':window.print();break;
 case 'audit-detail':{const r=state.admin.audit[Number(id)];openDialog('รายละเอียดการเปลี่ยนแปลง',`<h3>ก่อน</h3><pre>${esc(pretty(r.before_json))}</pre><h3>หลัง</h3><pre>${esc(pretty(r.after_json))}</pre><div class="modal-footer"><button class="outline" data-action="close-modal">ปิด</button></div>`);break;}
 }
 }catch(error){toast(error.message,true);}finally{if(btn.isConnected)btn.disabled=false;}
});
function pretty(v){try{return JSON.stringify(JSON.parse(v),null,2);}catch{return v;}}
document.addEventListener('submit',async e=>{
 const form=e.target;if(!form.id)return;e.preventDefault();if(state.busy)return;
 const values=Object.fromEntries(new FormData(form)),button=form.querySelector('[type="submit"]')||form.querySelector('button.primary');
 if(form.id==='login-form'){
  state.busy=true;button.disabled=true;button.textContent='กำลังเข้าสู่ระบบ…';
  try{await api('login',values);await load();render();}catch(error){const box=document.querySelector('#login-error');if(box)box.textContent=error.message;else toast(error.message,true);}finally{state.busy=false;if(button.isConnected){button.disabled=false;button.innerHTML=`เข้าสู่ระบบ ${icon('arrow')}`;}}return;
 }
 if(form.id==='password-form'){
  state.busy=true;button.disabled=true;try{await api('changePassword',values);modal.close();state.user=null;state.data=null;renderLogin();toast('เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบใหม่');}catch(error){document.querySelector('#modal-error').textContent=error.message;}finally{state.busy=false;button.disabled=false;}return;
 }
